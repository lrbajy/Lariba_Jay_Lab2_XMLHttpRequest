
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMLHttpRequest Lab</title>
</head>
<body>
    <h2>Exploring XMLHttpRequest</h2>

    <button id="loadData">Load Post Data</button>

    <div id="output" style="margin-top: 20px; border: 1px solid #ddd; padding: 10px;">
        Click the button to load post data.
    </div>

    <script>
        document.getElementById("loadData").addEventListener("click", function() {
            const xhr = new XMLHttpRequest();
            const output = document.getElementById("output");

            output.textContent = "Loading...";

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);

                        output.innerHTML = "";

                        const title = document.createElement("p");
                        const body = document.createElement("p");

                        title.textContent = "Post Title: " + data.title;
                        body.textContent = "Content: " + data.body;

                        output.appendChild(title);
                        output.appendChild(body);
                    } else {
                        output.innerHTML = "";

                        const error = document.createElement("p");
                        error.style.color = "red";
                        error.textContent = "Error: " + xhr.status +
                            " - Unable to load post data.";

                        output.appendChild(error);
                    }
                }
            };

            xhr.onerror = function() {
                output.innerHTML = "";

                const error = document.createElement("p");
                error.style.color = "red";
                error.textContent = "Network error. Please check your internet connection.";

                output.appendChild(error);
            };

            xhr.open("GET", "https://jsonplaceholder.typicode.com/posts/1", true);
            xhr.send();
        });
    </script>
</body>
</html>
